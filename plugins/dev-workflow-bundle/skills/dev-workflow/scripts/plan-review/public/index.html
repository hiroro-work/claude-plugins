<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Review — dev-workflow</title>

  <!-- Google Fonts is the one font host the artifact CSP admits; highlight.js theme stylesheets are blocked silently (see plan-view.css). -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Noto+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@600&display=swap">

  <!-- Classic scripts run before the deferred module, so window.marked / window.hljs exist. -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"
    integrity="sha512-V6rGY7jjOEUc7q5Ews8mMlretz1Vn2wLdMW/qgABLWunzsLfluM0FwHuGjGQ1lc8jO5vGpGIGFE+rTzB+63HdA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
    integrity="sha512-EBLzUL8XLl+va/zAsmXwS7Z2B1F9HUHkZwyS/VKwh3S7T/U0nF4BaU29EP/ZSf6zgiIxYAnKLu6bJ8dqpmX5uw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <link rel="stylesheet" href="./plan-view.css">
</head>
<body>
  <!-- Shell comes from PLAN_SHELL_HTML so the two surfaces can't drift; #done is ours alone. -->
  <div id="app">
    <div id="done" hidden>Submitted. Return to your terminal.</div>
  </div>

  <div id="bar">
    <div class="decision" role="radiogroup" aria-label="Plan decision">
      <label class="choice approve"><input type="radio" class="decision-radio" name="decision-approve" value="approve"> Approve</label>
      <label class="choice revise"><input type="radio" class="decision-radio" name="decision-revise" value="revise"> Request changes</label>
    </div>
    <span class="count">Comments: <span id="comment-count">0</span></span>
    <span class="kbd-hint" id="kbd-hint"></span>
    <span class="apply-note" id="apply-note"></span>
    <span class="spacer"></span>
    <span id="status"></span>
    <button id="send-btn" type="button" disabled>Send to Claude</button>
  </div>

  <script type="module">
    import {
      anchorMatches, anchorNorm, buildDiff, emptyDiff,
      escapeHtml, excerptOf, normText, preparePlan,
      sectionOfBlockId,
    } from "./plan-parse.mjs";
    import { AFFORDANCE_ATTR, HERO_SECTION_ID, PLAN_SHELL_HTML, LABELS, createRenderer, md, renderMermaidDiagrams } from "./plan-render.mjs";

    document.getElementById("app").insertAdjacentHTML("afterbegin", PLAN_SHELL_HTML);

    // comments: id -> { text, excerpt, kind } ; switches: id -> excerpt
    const state = { decision: null, comments: new Map(), switches: new Map() };
    let SWITCH_MSG = "Switch this decision to its Alternative";
    // Assigned via innerHTML in init: developer-controlled markup, never user data.
    let KBD_HINT = "<kbd>a</kbd> approve · <kbd>r</kbd> request changes · <kbd>⌘/Ctrl+↵</kbd> send";
    let APPLY_NOTE = "Requesting changes applies a comment to the plan document right away, or answers it here when it asks rather than asks for a change.";
    let TH = {
      you: "you",
      round: (n) => `Round ${n}`,
      log: (n) => `Conversation log (${n})`,
      pending: "awaiting reply",
      loose: "not anchored in the plan body",
      where: (t) => `on: ${t}`,
      disposition: { answered: "answered only", revised: "plan revised", both: "answered + revised" },
    };
    let POLL_MSG = "Claude is working on it — this page reloads itself when the plan updates.";
    let POLL_GIVEUP_MSG = "No update for 30 minutes. Check your terminal — the review may have moved on without the browser.";
    // A revise does not always come back here, so stop promising a reload well before 24h.
    const POLL_GIVEUP_MS = 30 * 60 * 1000;
    // Per-process token; a relaunch changes it, which is what the poll below watches for.
    let INSTANCE = null;

    // Replaced by buildDiff() when prevMarkdown is present; emptyDiff() documents the fields.
    let diff = emptyDiff();

    const COMMENT_BLOCK_TAGS = ["P", "BLOCKQUOTE", "PRE", "H4", "H5", "H6", "FIGURE"];

    // The one definition of a review block: comment and diff layers both read it. Children are snapshotted
    // first because attachElementComments wraps tables mid-walk.
    function commentTargets(root) {
      const out = [];
      for (const c of Array.from(root.children)) {
        const tag = c.tagName;
        if (tag === "UL" || tag === "OL") {
          for (const li of Array.from(c.children)) if (li.tagName === "LI") out.push(li);
        } else if (tag === "TABLE" || COMMENT_BLOCK_TAGS.includes(tag)) {
          out.push(c);
        }
      }
      return out;
    }

    function collectBlockTexts(bodyMarkdown) {
      const tmp = document.createElement("div");
      tmp.innerHTML = md(bodyMarkdown);
      return new Set(commentTargets(tmp).map((t) => normText(t.textContent)));
    }

    function effectiveComments() {
      const ids = new Set([...state.comments.keys(), ...state.switches.keys()]);
      const out = [];
      for (const id of ids) {
        const switched = state.switches.has(id);
        const c = state.comments.get(id);
        const txt = c ? c.text.trim() : "";
        const excerpt = (c && c.excerpt) || state.switches.get(id) || "";
        const kind = (c && c.kind) || "prose";
        let body = switched ? SWITCH_MSG + (txt ? "\n\n" + txt : "") : txt;
        if (body.trim()) out.push({ block: id, section: sectionOfBlockId(id, DECISIONS_SECTION_ID), excerpt, kind, body });
      }
      return out;
    }

    function onCommentsChanged() {
      const n = effectiveComments().length;
      document.getElementById("comment-count").textContent = String(n);
      if (n > 0 && !state.decision) selectDecision("revise"); // commenting implies a revise
    }

    function setComment(id, text, btn, excerpt, kind) {
      const v = text.trim();
      if (v) state.comments.set(id, { text, excerpt, kind: kind || "prose" }); else state.comments.delete(id);
      if (btn) btn.classList.toggle("has-comment", Boolean(v));
      onCommentsChanged();
    }

    function setSwitch(id, on, excerpt) {
      if (on) state.switches.set(id, excerpt || ""); else state.switches.delete(id);
      onCommentsChanged();
    }

    function selectDecision(v) {
      state.decision = v;
      // Distinct radio names keep each a Tab stop, so exclusivity is enforced here.
      document.querySelectorAll(".decision-radio").forEach((r) => { r.checked = (r.value === v); });
      document.getElementById("send-btn").disabled = false;
    }

    function makeCommentArea(placeholder) {
      const area = document.createElement("textarea");
      area.className = "comment-input";
      // plan-render.mjs' collapseBuildOrderSteps leaves anything carrying this outside its disclosure; rename both.
      area.dataset[AFFORDANCE_ATTR] = "";
      area.placeholder = placeholder;
      area.hidden = true;
      return area;
    }

    function wireCommentToggle(btn, area, id, excerpt, kind) {
      area.addEventListener("input", () => setComment(id, area.value, btn, excerpt, kind));
      btn.addEventListener("click", (e) => { e.preventDefault(); area.hidden = !area.hidden; if (!area.hidden) area.focus(); });
    }

    function makeFreeComment(id, excerpt, placeholder) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "comment-btn";
      btn.textContent = placeholder;
      const area = makeCommentArea(placeholder + "…");
      wireCommentToggle(btn, area, id, excerpt);
      return { btn, area };
    }

    function decorateDecisionCard({ card, id, n, excerpt, hasAlternative }) {
      if (hasAlternative) {
        const toggle = document.createElement("div");
        toggle.className = "dc-toggle";
        toggle.innerHTML =
          `<label><input type="radio" name="sw-${n}" value="keep" checked> Keep recommendation</label>` +
          `<label><input type="radio" name="sw-${n}" value="switch"> Switch to alternative</label>`;
        toggle.querySelectorAll("input").forEach((r) =>
          r.addEventListener("change", () => {
            const on = toggle.querySelector("input[value=switch]").checked;
            card.classList.toggle("switched", on);
            setSwitch(id, on, excerpt);
          }),
        );
        card.appendChild(toggle);
      }
      const { btn, area } = makeFreeComment(id, excerpt, "Comment on this decision");
      card.appendChild(btn);
      card.appendChild(area);
      affordanceHead.set(card, btn);
    }

    // Tags whose textarea goes inside the element; every other block gets it as a sibling. DIV is the table wrapper.
    const AREA_INSIDE = new Set(["LI", "BLOCKQUOTE", "DIV", "FIGURE"]);
    const affordanceHead = new WeakMap();
    const placeAffordance = (el, node) => {
      if (!AREA_INSIDE.has(el.tagName)) { el.insertAdjacentElement("afterend", node); return; }
      // A <figcaption> is only valid as the figure's first or last child, so go in front of it.
      const cap = el.tagName === "FIGURE" ? el.querySelector(":scope > figcaption") : null;
      if (cap) el.insertBefore(node, cap);
      else el.appendChild(node);
    };
    function attachComment(el, id) {
      el.classList.add("commentable");
      el.dataset.blockId = id;
      // Captured before collapseBuildOrderSteps and the affordances change the text a thread entry matches.
      el.dataset.anchorKey = anchorNorm(el.textContent);
      const excerpt = excerptOf(el.textContent);
      const kind = el.tagName === "FIGURE" ? "figure" : "prose";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cbtn";
      btn.dataset[AFFORDANCE_ATTR] = "";
      btn.title = "Comment on this";
      btn.textContent = "💬";
      const area = makeCommentArea("Comment on this…");
      wireCommentToggle(btn, area, id, excerpt, kind);
      el.appendChild(btn);
      placeAffordance(el, area);
      affordanceHead.set(el, area);
    }

    function attachElementComments(bodyEl, sectionId) {
      let n = 0;
      const targets = commentTargets(bodyEl).map((t) => {
        if (t.tagName !== "TABLE") return t;
        const w = document.createElement("div");
        t.replaceWith(w);
        w.appendChild(t);
        return w;
      });
      // Read textContent before attachComment appends the 💬 button.
      const prevSet = diff.prevBlockTexts.get(sectionId) || null;
      for (const t of targets) {
        if (prevSet && !t.dataset.mermaidFigure && !prevSet.has(normText(t.textContent))) t.classList.add("block-changed");
        attachComment(t, `${sectionId}::${++n}`);
      }
    }

    let THREAD = [];
    let HERO_EL = null;
    let DECISIONS_SECTION_ID = "";
    const threadBoxes = new Map();

    const entrySection = (e) => (e.anchor && e.anchor.section) || sectionOfBlockId(e.block, DECISIONS_SECTION_ID);

    // A figure resolves by section: its own text is SVG labels or fence source.
    function findAnchorTarget(e) {
      const secId = entrySection(e);
      if (!secId) return null;
      // The hero is the one "section" whose container is not a `sec-` element.
      const sec = secId === HERO_SECTION_ID
        ? HERO_EL
        : document.getElementById(`sec-${secId}`);
      if (!sec) return null;
      if (e.kind === "figure") return sec.querySelector("figure");
      const want = anchorNorm(e.anchor && e.anchor.excerpt);
      const hits = [];
      for (const el of sec.querySelectorAll("[data-anchor-key]")) {
        if (anchorMatches(want, el.dataset.anchorKey)) hits.push(el);
      }
      // Exactly one, or none — an ambiguous match under the wrong block misreads as an answer.
      return hits.length === 1 ? hits[0] : null;
    }

    function threadItem(e, roundNo, opts) {
      const item = document.createElement("div");
      item.className = "th-item";
      const meta = document.createElement("div");
      meta.className = "th-meta";
      meta.textContent = `${TH.round(roundNo)} · ${TH.you}`;
      item.appendChild(meta);
      if (opts && opts.where) {
        const w = document.createElement("div");
        w.className = "log-where";
        w.textContent = TH.where(opts.where);
        item.appendChild(w);
      }
      const body = document.createElement("div");
      body.className = "th-body";
      body.textContent = e.body || "";
      item.appendChild(body);

      const reply = document.createElement("div");
      reply.className = "th-reply";
      const head = document.createElement("div");
      head.className = "th-meta";
      const label = Object.prototype.hasOwnProperty.call(TH.disposition, e.disposition) ? TH.disposition[e.disposition] : null;
      head.innerHTML =
        (e.reply ? (label ? `<span class="th-badge">${escapeHtml(label)}</span>` : "")
                 : `<span class="th-badge pending">${escapeHtml(TH.pending)}</span>`) + "Claude";
      reply.appendChild(head);
      if (e.reply) {
        const b = document.createElement("div");
        b.innerHTML = md(e.reply);
        reply.appendChild(b);
      }
      item.appendChild(reply);

      if (opts && opts.loose) {
        const w = document.createElement("div");
        w.className = "th-loose";
        w.textContent = TH.loose;
        item.appendChild(w);
      }
      return item;
    }

    function threadBox(target) {
      let box = threadBoxes.get(target);
      if (!box) {
        box = document.createElement("div");
        box.className = "thread";
        box.dataset[AFFORDANCE_ATTR] = "";
        const head = affordanceHead.get(target);
        if (head && head.parentNode === target) target.insertBefore(box, head);
        else placeAffordance(target, box);
        threadBoxes.set(target, box);
      }
      return box;
    }

    function renderThread() {
      const loose = new Set();
      for (const round of THREAD) {
        for (const e of round.entries || []) {
          const target = findAnchorTarget(e);
          if (!target) { loose.add(e); continue; }
          threadBox(target).appendChild(threadItem(e, round.round));
        }
      }
      return loose;
    }

    function renderLog(planEl, loose) {
      const total = THREAD.reduce((n, r) => n + (r.entries || []).length, 0);
      if (!total) return;
      const det = document.createElement("details");
      det.id = "log";
      det.open = true;
      const sum = document.createElement("summary");
      sum.textContent = TH.log(total);
      det.appendChild(sum);
      for (const round of THREAD) {
        const rd = document.createElement("div");
        rd.className = "log-round";
        const h = document.createElement("h4");
        h.textContent = TH.round(round.round);
        rd.appendChild(h);
        for (const e of round.entries || []) {
          rd.appendChild(threadItem(e, round.round, {
            where: (e.anchor && e.anchor.excerpt) || e.block || "",
            loose: loose.has(e),
          }));
        }
        det.appendChild(rd);
      }
      planEl.appendChild(det);
    }

    async function init() {
      const res = await fetch("/api/plan", { cache: "no-store" });
      if (!res.ok) throw new Error(`/api/plan HTTP ${res.status}`);
      const { id, markdown, lang, prevMarkdown, thread, instance } = await res.json();
      THREAD = Array.isArray(thread) ? thread : [];
      INSTANCE = instance || null;
      // plan-view.css reads this for --measure (a ch measure is half a line in Japanese).
      document.documentElement.lang = lang === "ja" ? "ja" : "en";
      if (lang === "ja") {
        SWITCH_MSG = "この Decision を Alternative に切り替える";
        KBD_HINT = "<kbd>a</kbd> 承認 · <kbd>r</kbd> 変更を依頼 · <kbd>⌘/Ctrl+↵</kbd> 送信";
        APPLY_NOTE = "変更を依頼すると、コメントはその時点でプラン文書に反映されます。質問のコメントはプランを変えずにこのページ上で回答します。";
        TH = {
          you: "あなた",
          round: (n) => `ラウンド ${n}`,
          log: (n) => `会話ログ（${n} 件）`,
          pending: "返答待ち",
          loose: "本文中に位置を特定できませんでした",
          where: (t) => `対象: ${t}`,
          disposition: { answered: "回答のみ", revised: "プラン修正", both: "回答 + プラン修正" },
        };
        POLL_MSG = "Claude が対応中です。プランが更新されるとこのページは自動で読み直されます。";
        POLL_GIVEUP_MSG = "30 分間更新がありませんでした。ターミナルを確認してください（レビューがブラウザを離れて進んでいる可能性があります）。";
      }
      document.getElementById("kbd-hint").innerHTML = KBD_HINT;
      document.getElementById("apply-note").textContent = APPLY_NOTE;

      const model = preparePlan(markdown, id);
      const { sections } = model;

      if (typeof prevMarkdown === "string" && prevMarkdown.trim()) diff = buildDiff(prevMarkdown, sections, collectBlockTexts);

      DECISIONS_SECTION_ID = (sections.find((s) => s.type === "decisions") || {}).id || "";

      const renderer = createRenderer({
        labels: LABELS[lang] || LABELS.en,
        diff,
        hooks: {
          decorateDecisionCard,
          decorateSection: ({ bodyEl, section }) => attachElementComments(bodyEl, section.id),
          renderDiagrams: renderMermaidDiagrams,
        },
      });

      const { planEl, heroEl } = await renderer.renderPlan(model);
      HERO_EL = heroEl;

      // After the collapse, so a thread stays outside the <details> on a collapsed step.
      renderLog(planEl, renderThread());
      for (const box of threadBoxes.values()) {
        const fold = box.closest("details.fold");
        if (fold) fold.open = true;
      }
    }

    document.querySelectorAll(".decision-radio").forEach((radio) => {
      radio.addEventListener("change", () => selectDecision(radio.value));
    });

    document.getElementById("send-btn").addEventListener("click", submit);

    // Focus-independent, because macOS Full Keyboard Access (off by default) makes Chrome
    // drop the radios and Send button from Tab order.
    document.addEventListener("keydown", (e) => {
      if (e.isComposing) return;                                            // mid-IME (e.g. Japanese) — don't hijack
      if (document.getElementById("app").classList.contains("submitted")) return; // gate already sent
      // Bare Enter is deliberately unbound: it must keep toggling <details> and activating buttons natively.
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        if (state.decision) { e.preventDefault(); submit(); }
        return;
      }
      const active = document.activeElement;
      const tag = active ? active.tagName : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (e.key === "a") { e.preventDefault(); selectDecision("approve"); }
      else if (e.key === "r") { e.preventDefault(); selectDecision("revise"); }
    });

    function startPolling() {
      if (!INSTANCE) return; // nothing to compare against — a reload would fire on the first poll
      const deadline = Date.now() + POLL_GIVEUP_MS;
      const timer = setInterval(async () => {
        if (Date.now() > deadline) {
          clearInterval(timer);
          document.getElementById("done").textContent = POLL_GIVEUP_MSG;
          return;
        }
        try {
          const r = await fetch("/api/instance", { cache: "no-store" });
          if (!r.ok) return;
          const j = await r.json();
          if (j.instance && j.instance !== INSTANCE) location.reload();
        } catch {
          /* server down between launches — keep waiting */
        }
      }, 2000);
    }

    let submitting = false; // re-entry guard: the button is disabled on click, but the keydown path is not
    async function submit() {
      if (submitting || !state.decision) return;
      submitting = true;
      const comments = effectiveComments();
      const sendBtn = document.getElementById("send-btn");
      const status = document.getElementById("status");
      sendBtn.disabled = true;
      status.textContent = "";
      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ decision: state.decision, comments }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        // `submitting` stays true on success; the "submitted" class is the keydown guard's early return.
        document.getElementById("app").classList.add("submitted");
        const done = document.getElementById("done");
        if (state.decision === "revise") {
          done.textContent = POLL_MSG;
          startPolling();
        }
        done.hidden = false;
        document.getElementById("bar").style.display = "none";
        done.scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        submitting = false; // allow a retry after a failed POST
        sendBtn.disabled = false;
        status.textContent = `Failed to send: ${err.message}`;
      }
    }

    init().catch((err) => {
      document.getElementById("status").textContent = `Failed to load: ${err.message}`;
      console.error(err);
    });
  </script>
</body>
</html>
