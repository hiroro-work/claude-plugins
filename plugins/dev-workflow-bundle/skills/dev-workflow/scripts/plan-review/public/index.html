<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Review — dev-workflow</title>

  <!-- highlight.js theme (cdnjs, pinned + SRI) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
    integrity="sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link
    rel="stylesheet" media="(prefers-color-scheme: dark)"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- marked (UMD) + highlight.js (UMD): classic scripts run before the deferred module below,
       so window.marked / window.hljs are ready when the render logic runs. -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"
    integrity="sha512-V6rGY7jjOEUc7q5Ews8mMlretz1Vn2wLdMW/qgABLWunzsLfluM0FwHuGjGQ1lc8jO5vGpGIGFE+rTzB+63HdA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
    integrity="sha512-EBLzUL8XLl+va/zAsmXwS7Z2B1F9HUHkZwyS/VKwh3S7T/U0nF4BaU29EP/ZSf6zgiIxYAnKLu6bJ8dqpmX5uw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    :root {
      /* Palette: warm, low-glare ground with a green accent (mirrors the eli5 artifact) */
      --page-bg: #f1f4f0;      /* page ground — never the card surface */
      --bg: #ffffff;           /* card / panel surface */
      --bg-soft: #e7ece8;
      --fg: #1a231f;
      --muted: #5c6b64;
      --border: #c8d3cd;
      --accent: #0d6b5f;
      --accent-soft: #d3e5df;
      --accent-ink: #08453d;
      --on-accent: #ffffff;   /* text on an --accent fill */
      --approve: #1a7f37;
      --approve-bg: #dceee4;
      --approve-border: #a9cdb8;
      --revise: #8a5a12;
      --revise-bg: #f4e7d8;
      --revise-border: #dcc39a;
      --rec: var(--approve);
      --risk: var(--revise);
      --risk-bg: var(--revise-bg);
      --risk-border: var(--revise-border);
      --switched-bg: #f7f2ea;
      --hover: #dbe3dd;
      /* diff "changed" accent — shares the revise hue (risk chrome does too, via --risk);
         what separates a changed block is its left bar and badge, not its colour */
      --changed: var(--revise);
      --changed-bg: #f0e4cf;
      --banner-border: #d9b85f;
      --banner-fg: #6b4a12;
      --bar-h: 64px;
      color-scheme: light;
    }
    /* Dark theme: same roles, re-toned. Every color above is redefined here, so no
       rule outside this block may hardcode a hex. */
    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #121815;
        --bg: #1a231f;
        --bg-soft: #222d28;
        --fg: #e5ebe7;
        --muted: #94a39b;
        --border: #35443c;
        --accent: #56c2ab;
        --accent-soft: #21362f;
        --accent-ink: #9fdccd;
        --on-accent: #0d1a17;
        --approve: #5fc47f;
        --approve-bg: #1c3325;
        --approve-border: #2f5c3f;
        --revise: #d6a850;
        --revise-bg: #33291a;
        --revise-border: #5c4a27;
        --switched-bg: #26201a;
        --hover: #2c3a33;
        --changed-bg: #33291a;
        --banner-border: #5c4a27;
        --banner-fg: #f0d9a8;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      color: var(--fg);
      background: var(--page-bg);
      line-height: 1.7;
    }
    #app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 28px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 24px calc(var(--bar-h) + 32px);
    }
    /* summary header */
    header.plan-head {
      grid-column: 1 / -1;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 4px;
    }
    header.plan-head .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    header.plan-head h1 { font-size: 20px; margin: 2px 0 10px; line-height: 1.4; }
    header.plan-head h1 code { font-size: 0.9em; }
    #plan-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: baseline; gap: 6px;
      font-size: 12px; color: var(--fg);
      background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 12px;
    }
    .chip b { color: var(--muted); font-weight: 600; }
    .chip.risk { background: var(--risk-bg); border-color: var(--risk-border); color: var(--risk); }
    .chip.risk b { color: var(--risk); }
    /* Scope is descriptive prose, not an enum — give it a labeled meta row that wraps,
       instead of cramming it into a fixed-shape pill like Difficulty / Risks */
    #plan-scope { margin-top: 8px; }
    .meta-scope { display: flex; gap: 8px; align-items: baseline; font-size: 12px; line-height: 1.5; }
    .meta-scope .meta-label {
      flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); padding-top: 2px;
    }
    .meta-scope .meta-val { color: var(--fg); min-width: 0; }
    /* section nav */
    #toc {
      position: sticky; top: 16px; align-self: start;
      max-height: calc(100vh - 32px); overflow: auto;
      font-size: 13px; border-right: 1px solid var(--border); padding-right: 14px;
    }
    #toc .toc-title { font-weight: 600; color: var(--muted); margin-bottom: 8px; }
    #toc a { display: block; color: var(--muted); text-decoration: none; padding: 3px 0; }
    #toc a:hover { color: var(--accent); }
    /* main */
    main#plan { min-width: 0; }
    .preamble { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .preamble blockquote { border-left: 3px solid var(--border); margin: 0; padding: 2px 12px; }
    details.section {
      border: 1px solid var(--border); border-radius: 10px;
      margin: 12px 0; padding: 0 16px; background: var(--bg);
    }
    details.section[open] { padding-bottom: 8px; }
    /* Disclosure affordance, shared by sections and by the Build order steps inside them
       (details.step, collapsed by collapseBuildOrderSteps) — one glyph, one rotation. */
    details.section > summary, details.step > summary {
      cursor: pointer; list-style: none; display: flex;
    }
    details.section > summary::-webkit-details-marker,
    details.step > summary::-webkit-details-marker { display: none; }
    details.section > summary::before, details.step > summary::before {
      content: "▸"; color: var(--muted); transition: transform .12s;
    }
    details.section[open] > summary::before,
    details.step[open] > summary::before { transform: rotate(90deg); }
    details.section > summary { padding: 12px 0; align-items: center; gap: 10px; font-weight: 600; }
    details.section > summary::before { font-size: 12px; }
    /* Context = the "why" framing; tint it so it reads as lead context, not a structural section */
    details.section.is-context { background: var(--bg-soft); border-color: var(--border); }
    details.section.is-context > summary .sec-title { color: var(--muted); }
    details.section.is-context .sec-body { color: var(--fg); }
    .sec-title { font-size: 15px; }
    .badge {
      font-size: 11px; font-weight: 700; border-radius: 999px;
      padding: 1px 8px; background: var(--bg-soft); color: var(--muted);
    }
    .badge-risk { background: var(--risk-bg); color: var(--risk); }
    .sec-body { padding-top: 2px; }
    /* .step-body is inside .sec-body, so every .sec-body descendant rule already reaches it;
       this one needs naming because it is a direct-child selector. */
    .sec-body > :first-child, .step-body > :first-child { margin-top: 4px; }
    .sec-body h1 { font-size: 20px; }
    .sec-body h2 { font-size: 17px; }
    .sec-body h3, .sec-body h4 { font-size: 14px; }
    .sec-body pre {
      background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; overflow: auto;
    }
    .sec-body code:not(pre code) {
      background: var(--bg-soft); border-radius: 4px; padding: 1px 5px; font-size: 0.9em;
    }
    .sec-body table { border-collapse: collapse; }
    .sec-body th, .sec-body td { border: 1px solid var(--border); padding: 4px 10px; }
    .sec-body .mermaid { background: var(--bg); text-align: center; margin: 10px 0; }
    /* figures layer: a <figure> the gate merged in, carrying inline SVG */
    .sec-body figure { margin: 12px 0; text-align: center; }
    .sec-body figure svg { max-width: 100%; height: auto; }
    .sec-body figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
    /* Build order steps: the section sits in the must-review tier yet opens at N one-line
       headings. The disclosure triangle itself is shared with details.section above. */
    details.step > summary { align-items: baseline; gap: 8px; }
    details.step > summary::before { font-size: 10px; }
    details.step > .step-body { padding: 2px 0 2px 18px; }
    .sec-body blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 0 12px; color: var(--muted); }
    /* decision cards */
    .decision-card {
      border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 10px 14px; margin: 10px 0; background: var(--bg);
    }
    .decision-card.switched { border-left-color: var(--revise); background: var(--switched-bg); }
    .dc-q { font-weight: 600; margin-bottom: 8px; }
    .dc-q .dc-tag {
      display: inline-block; font-size: 11px; font-weight: 700; color: var(--on-accent);
      background: var(--accent); border-radius: 4px; padding: 1px 7px; margin-right: 6px; vertical-align: 1px;
    }
    .decision-card.switched .dc-q .dc-tag { background: var(--revise); }
    .dc-rec, .dc-alt { font-size: 14px; border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
    .dc-rec { background: var(--approve-bg); border: 1px solid var(--approve-border); }
    .dc-alt { background: var(--bg-soft); border: 1px solid var(--border); color: var(--muted); }
    .decision-card.switched .dc-rec { background: var(--bg-soft); border-color: var(--border); color: var(--muted); }
    .decision-card.switched .dc-alt { background: var(--revise-bg); border-color: var(--revise-border); color: var(--fg); }
    .dc-rec > :first-child, .dc-alt > :first-child { margin-top: 2px; }
    .dc-rec > :last-child, .dc-alt > :last-child { margin-bottom: 2px; }
    .dc-label {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
    }
    .dc-rec .dc-label { color: var(--rec); }
    .dc-toggle { display: flex; gap: 14px; margin: 8px 0 2px; font-size: 13px; }
    .dc-toggle label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); }
    .dc-toggle label:has(input:checked) { color: var(--fg); font-weight: 600; }
    /* comment affordances */
    /* Highlight the block under the cursor so the comment target's extent is obvious — the
       per-element comment model treats each paragraph / list item as its own target. The tint
       is a step deeper than --bg-soft so it stays visible inside the tinted Context section too. */
    .commentable { position: relative; border-radius: 6px; transition: background .12s; }
    .commentable:hover { background: var(--hover); }
    .cbtn {
      position: absolute; top: 0; right: -2px; opacity: 0;
      font-size: 12px; line-height: 1; border: 1px solid var(--border);
      background: var(--bg); border-radius: 6px; padding: 2px 6px; cursor: pointer;
      transition: opacity .1s;
    }
    .commentable:hover > .cbtn, .cbtn.has-comment { opacity: 1; }
    .cbtn.has-comment { border-color: var(--revise); }
    .comment-btn {
      font-size: 12px; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; cursor: pointer; margin-top: 6px;
    }
    .comment-btn:hover { color: var(--accent); border-color: var(--accent); }
    .comment-btn.has-comment { color: var(--revise); border-color: var(--revise); font-weight: 600; }
    .comment-input {
      display: block; width: 100%; min-height: 56px; margin: 6px 0 8px; padding: 8px;
      font: inherit; font-size: 13px; border: 1px solid var(--accent); border-radius: 6px; resize: vertical;
      background: var(--bg); color: var(--fg);
    }
    .comment-input[hidden] { display: none; } /* the `display: block` above otherwise defeats the `hidden` attribute */
    /* conversation thread: past rounds replayed under the block they were anchored on, and
       replayed again in full in the log panel at the end of the plan. */
    .thread { margin: 8px 0 4px; border-left: 3px solid var(--accent); padding-left: 10px; }
    .th-item + .th-item { margin-top: 10px; }
    .th-meta { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
    .th-body { white-space: pre-wrap; font-size: 13px; margin-top: 2px; }
    .th-reply { font-size: 13px; margin-top: 4px; }
    .th-reply > :first-child { margin-top: 0; }
    .th-reply > :last-child { margin-bottom: 0; }
    .th-badge {
      display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-ink); margin-right: 6px; white-space: nowrap;
    }
    .th-badge.pending { background: var(--changed-bg); color: var(--changed); }
    .th-loose { color: var(--revise); font-size: 11px; }
    #log { margin-top: 22px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
    #log > summary { cursor: pointer; font-weight: 600; }
    .log-round { margin-top: 12px; }
    .log-round > h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .log-where { font-size: 11px; color: var(--muted); }
    /* diff mode: surfaced only on a revise re-launch (prevMarkdown present).
       Badges + highlights mark what changed since the user's previous review,
       so unchanged sections can stay collapsed and the eye goes to the edits. */
    #diff-banner {
      grid-column: 1 / -1; margin: 6px 0 0; padding: 8px 12px;
      background: var(--changed-bg); border: 1px solid var(--banner-border); border-radius: 8px;
      font-size: 13px; color: var(--banner-fg);
    }
    .badge-diff { background: var(--changed-bg); color: var(--changed); }
    /* changed block: inset left bar + faint tint; box-shadow survives the
       .commentable:hover background swap so the marker stays visible on hover.
       --changed, never --accent, so it never reads as the base card border. */
    .commentable.block-changed { background: var(--changed-bg); box-shadow: inset 3px 0 0 0 var(--changed); }
    /* changed decision card: a thick --changed left bar + faint wash, replacing the
       base --accent left border, so "this Decision changed" reads at a glance (far
       more legible than a thin outline). Scoped :not(.switched) so a card toggled to
       its alternative still shows the .switched styling — the active user action
       wins over the historical diff mark. */
    .decision-card.card-changed:not(.switched) {
      border-left: 5px solid var(--changed);
      background: var(--changed-bg);
    }
    /* sticky decision bar */
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar-h);
      display: flex; align-items: center; gap: 16px; padding: 0 24px;
      background: var(--bg); border-top: 1px solid var(--border); box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
    }
    #bar .decision { display: flex; gap: 8px; }
    #bar label.choice {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px;
    }
    #bar label.choice:has(input:checked).approve { border-color: var(--approve); color: var(--approve); font-weight: 600; }
    #bar label.choice:has(input:checked).revise { border-color: var(--revise); color: var(--revise); font-weight: 600; }
    #bar .spacer { flex: 1; }
    #bar .count { color: var(--muted); font-size: 13px; }
    /* keyboard-shortcut hint: the decision bar's native controls drop out of Tab
       order when macOS Full Keyboard Access is off (Chrome mirrors that setting),
       so the a/r/↵ shortcuts are the reliable keyboard path — surface them here. */
    /* .apply-note says what "Request changes" does to the plan document, so the
       choice is made with that in view */
    #bar .kbd-hint, #bar .apply-note { color: var(--muted); font-size: 12px; }
    #bar .kbd-hint kbd {
      font: inherit; background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 4px; padding: 0 5px;
    }
    #send-btn {
      font-size: 14px; font-weight: 600; color: var(--on-accent); background: var(--accent);
      border: none; border-radius: 8px; padding: 8px 20px; cursor: pointer;
    }
    #send-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    #status { color: var(--revise); font-size: 13px; }
    #done { grid-column: 1 / -1; text-align: center; padding: 40px; font-size: 16px; color: var(--approve); }
    #app.submitted main#plan, #app.submitted #toc { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app">
    <header class="plan-head">
      <div class="eyebrow">Plan Review — <span id="plan-id">…</span></div>
      <h1 id="plan-title">…</h1>
      <div id="plan-chips"></div>
      <div id="plan-scope" class="meta-scope" hidden></div>
      <div id="diff-banner" hidden></div>
    </header>
    <nav id="toc"><div class="toc-title">Sections</div></nav>
    <main id="plan"></main>
    <div id="done" hidden>Submitted. Return to your terminal.</div>
  </div>

  <div id="bar">
    <div class="decision" role="radiogroup" aria-label="Plan decision">
      <label class="choice approve"><input type="radio" class="decision-radio" name="decision-approve" value="approve"> Approve</label>
      <label class="choice revise"><input type="radio" class="decision-radio" name="decision-revise" value="revise"> Request changes</label>
    </div>
    <span class="count">Comments: <span id="comment-count">0</span></span>
    <span class="kbd-hint" id="kbd-hint"></span>
    <span class="apply-note" id="apply-note"></span>
    <span class="spacer"></span>
    <span id="status"></span>
    <button id="send-btn" type="button" disabled>Send to Claude</button>
  </div>

  <script type="module">
    import mermaid from "https://esm.sh/mermaid@11.15.0";

    // Read once: mermaid bakes its theme at initialize, so an OS theme flip mid-review leaves
    // diagrams in the previous theme until the page is reloaded. Everything else follows the
    // media query live.
    const darkScheme = window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, theme: darkScheme ? "dark" : "default", securityLevel: "strict" });

    // comments: id -> { text, excerpt, kind } ; switches: id -> excerpt
    const state = { decision: null, comments: new Map(), switches: new Map() };
    let SWITCH_MSG = "Switch this decision to its Alternative";
    // localized keyboard-shortcut hint — static developer-controlled markup (assigned
    // via innerHTML in init, like SWITCH_MSG); never holds user data, so not an XSS vector
    let KBD_HINT = "<kbd>a</kbd> approve · <kbd>r</kbd> request changes · <kbd>⌘/Ctrl+↵</kbd> send";
    let APPLY_NOTE = "Requesting changes applies a comment to the plan document right away, or answers it here when it asks rather than asks for a change.";
    // conversation-log labels, localized in init alongside SWITCH_MSG
    let TH = {
      you: "you",
      round: (n) => `Round ${n}`,
      log: (n) => `Conversation log (${n})`,
      pending: "awaiting reply",
      loose: "not anchored in the plan body",
      where: (t) => `on: ${t}`,
      disposition: { answered: "answered only", revised: "plan revised", both: "answered + revised" },
    };
    let POLL_MSG = "Claude is working on it — this page reloads itself when the plan updates.";
    let POLL_GIVEUP_MSG = "No update for 30 minutes. Check your terminal — the review may have moved on without the browser.";
    // The gate itself waits up to 24h, but a revise does not always come back here: an
    // approach-level rewrite or a fallback to chat approval ends the run elsewhere. Stop
    // promising a reload well before then and say so.
    const POLL_GIVEUP_MS = 30 * 60 * 1000;
    // Per-process token from /api/plan. A relaunch produces a different one, which is what the
    // post-revise poll below watches for.
    let INSTANCE = null;

    // diff mode (revise re-launch): populated by buildDiff() when prevMarkdown is present.
    //   sectionStatus:    id -> "new" | "changed" | "unchanged"
    //   prevBlockTexts:   id -> Set<normalized block text>        (changed sections only)
    //   prevDecisionSigs: id -> Set<normalized decision signature> (changed Decisions sections only)
    const diff = { active: false, sectionStatus: new Map(), prevBlockTexts: new Map(), prevDecisionSigs: new Map(), changedCount: 0, removedCount: 0 };
    // localized diff-banner text (set from `lang` in init, like SWITCH_MSG); the
    // "Changed" / "New" badges stay English UI chrome and are not localized.
    let DIFF_BANNER = (n, removed) => `🔍 ${n} section${n === 1 ? "" : "s"} changed or added since your last review${removed ? `, ${removed} removed` : ""} — changes highlighted below`;
    let DIFF_BANNER_NONE = "🔍 No section changes since your last review";

    const md = (t) => window.marked.parse(t || "");
    const mdInline = (t) => window.marked.parseInline(t || "");
    const stripMd = (t) => (t || "").replace(/[*`]/g, "").trim();
    const normText = (t) => (t || "").replace(/\s+/g, " ").trim();
    const excerptOf = (t) => normText(t).slice(0, 40);
    // One normal form for both sides of an anchor comparison. The browser's excerpt comes from
    // rendered DOM text while the caller writes an anchor from Markdown source, so the markup
    // the renderer already consumed has to come off before the two can be compared at all.
    const anchorNorm = (t) =>
      normText(String(t || "").replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[*_`~]/g, "")).toLowerCase();
    // Tolerant on length: an anchor is a prefix of the block, or the block of the anchor once an
    // edit shortened it. The floor keeps a near-empty block from matching everything.
    const anchorMatches = (a, b) => {
      if (!a || !b) return false;
      const [short, long] = a.length <= b.length ? [a, b] : [b, a];
      return short.length >= 8 && long.startsWith(short);
    };
    // The section a block id names. Both id forms encode it, so nothing has to be threaded
    // through the comment-state calls; `decision-<n>` resolves against the section found in init.
    const sectionOfBlockId = (id) => {
      const b = String(id || "");
      if (b.includes("::")) return b.slice(0, b.indexOf("::"));
      return b.startsWith("decision-") ? DECISIONS_SECTION_ID : "";
    };
    const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
    const escapeHtml = (t) => (t || "").replace(/[&<>"]/g, (c) => HTML_ESCAPES[c]);

    const FENCE_RE = /^\s*(`{3,}|~{3,})/;

    // Block-level tags that are commentable as whole blocks (UL/OL → per-LI and
    // TABLE → wrapped are handled separately). Shared by attachElementComments
    // (renders comment affordances) and collectBlockTexts (read-only diff text),
    // so the two stay in sync.
    const COMMENT_BLOCK_TAGS = ["P", "BLOCKQUOTE", "PRE", "H4", "H5", "H6", "FIGURE"];

    // What the viewer knows about each plan section, in match-priority order: `match` lists title
    // prefixes (lowercased) that map to the type; `open` opens the section by default;
    // `collapseSteps` collapses each of the section's numbered steps to its bold heading. The
    // Decisions/Risks render paths key off `type` below.
    // Both skills' plan formats share the `Build order` heading; the remaining alternate prefixes
    // in each list are mobpro's own heading names. Source of truth for the shared prefix:
    // dev-workflow's `references/plan-authoring.md` § Template (mobpro's references/plan-shape.md follows it);
    // mobpro's own headings are defined in that file. Keep in sync either way — a
    // heading renamed upstream and not here silently returns that plan to all-collapsed. Those
    // prefixes stop short of an apostrophe so straight vs. curly quotes cannot break the match.
    // mobpro's `Why this order` takes its own type rather than riding along with buildorder: it
    // wants the same open-by-default treatment but must not have its reasoning collapsed away.
    const SECTION_TYPES = [
      { type: "overview", match: ["overview", "what we"], open: true },
      { type: "decisions", match: ["decision", "choices i made"], open: true },
      { type: "buildorder", match: ["build order"], open: true, collapseSteps: true },
      { type: "whyorder", match: ["why this"], open: true },
      { type: "test", match: ["test plan", "test", "how we"] },
      { type: "risks", match: ["risk", "unknown", "watch-out"] },
      { type: "context", match: ["context"], open: true },
    ];
    const OPEN_TYPES = new Set(SECTION_TYPES.filter((s) => s.open).map((s) => s.type));
    const STEP_COLLAPSE_TYPES = new Set(SECTION_TYPES.filter((s) => s.collapseSteps).map((s) => s.type));

    function classify(title) {
      const t = title.toLowerCase().replace(/\s+/g, " ").trim();
      const hit = SECTION_TYPES.find((s) => s.match.some((m) => t.startsWith(m)));
      return hit ? hit.type : "other";
    }

    function slugify(title) {
      return (title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")) || "section";
    }

    // Split the plan into level-3 (###) sections, tracking fenced code so a ### inside a
    // code block is not mistaken for a heading. Content before the first ### is the preamble.
    function parseSections(markdown) {
      const lines = markdown.split(/\r?\n/);
      const sections = [];
      const preamble = [];
      let cur = null;
      let inFence = false;
      const seen = {};
      for (const line of lines) {
        if (FENCE_RE.test(line)) inFence = !inFence;
        const h = !inFence && /^###\s+(.+?)\s*$/.exec(line);
        if (h) {
          const title = h[1];
          const base = slugify(title);
          let id = base, n = 1;
          while (seen[id]) id = `${base}-${++n}`; // probe until unused so "Build order 2" can't collide with a 2nd "Build order"
          seen[id] = 1;
          cur = { title, type: classify(title), id, lines: [] };
          sections.push(cur);
          continue;
        }
        if (cur) cur.lines.push(line);
        else preamble.push(line);
      }
      for (const s of sections) s.body = s.lines.join("\n").trim();
      return { preamble: preamble.join("\n").trim(), sections };
    }

    function fieldValue(body, label) {
      const re = new RegExp("\\*\\*" + label + "\\*\\*\\s*[:：]\\s*(.*)");
      for (const line of body.split("\n")) {
        const m = re.exec(line);
        if (m) return m[1].trim();
      }
      return "";
    }

    function parseOverview(body) {
      return {
        goal: fieldValue(body, "Goal"),
        difficulty: fieldValue(body, "Difficulty"),
        scope: fieldValue(body, "Scope"),
      };
    }

    function countListItems(body) {
      let inFence = false, n = 0;
      for (const line of (body || "").split("\n")) {
        if (FENCE_RE.test(line)) inFence = !inFence;
        if (!inFence && /^\s{0,1}(?:[-*]|\d+\.)\s+\S/.test(line)) n++;
      }
      return n;
    }

    // Split the Decisions body into items by the **Question** marker; capture each item's
    // question / recommendation / alternative raw text for card rendering.
    function parseDecisions(body) {
      const FIELD_RE = /^\s*(?:[-*]\s+)?\*\*(Question|Recommendation|Alternative)\*\*\s*[:：]?\s*(.*)$/;
      // An unindented numbered bold-only line ("**1. title**") starts an item, but only when a
      // **Question** is the next non-blank line after it. Both guards keep the rule from ever splitting
      // a field body: an indented or unnumbered bold line, any ATX heading, and a bold line followed by
      // prose all stay body text, because splitting there truncates a Recommendation and carries its
      // tail onto the next card. Everything outside that one shape keeps the old fold — the template
      // statement is the real fix; this is only the net under it.
      const ITEM_HEAD_RE = /^\*\*(\d+[.)]\s*\S.*?)\*\*\s*$/;
      const items = [];
      const preamble = [];
      const lines = body.split("\n");
      // Fence state after each line, so the lookahead reads it instead of re-scanning.
      const fenced = [];
      for (let i = 0, f = false; i < lines.length; i++) {
        if (FENCE_RE.test(lines[i])) f = !f;
        fenced.push(f);
      }
      const headStartsItem = (i) => {
        for (let j = i + 1; j < lines.length; j++) {
          if (fenced[j] || !lines[j].trim()) continue;
          const fm = FIELD_RE.exec(lines[j]);
          return !!fm && fm[1].toLowerCase() === "question";
        }
        return false;
      };
      let cur = null, field = null, curFromHead = false;
      const open = (question, fromHead) => {
        cur = { question, recommendation: "", alternative: "" };
        items.push(cur);
        field = "question";
        curFromHead = !!fromHead;
      };
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const inFence = fenced[i];
        const m = inFence ? null : FIELD_RE.exec(line);
        if (m) {
          const f = m[1].toLowerCase();
          if (f === "question") {
            // Fold into an item the heading rule just opened, so both shapes yield one item. Only
            // then — two consecutive **Question** lines still open two items, as they always did.
            if (curFromHead && !cur.recommendation && !cur.alternative) {
              cur.question += (cur.question ? "\n\n" : "") + (m[2] || "");
              field = "question";
            } else {
              open(m[2] || "", false);
            }
          } else if (cur) {
            field = f;
            cur[f] = m[2] || "";
          } else {
            preamble.push(line); // stray Recommendation/Alternative before any Question — keep, don't drop
          }
          continue;
        }
        const h = inFence ? null : ITEM_HEAD_RE.exec(line);
        if (h && headStartsItem(i)) {
          open(h[1], true);
          continue;
        }
        if (cur && field) cur[field] += "\n" + line;
        else if (!cur) preamble.push(line);
      }
      for (const it of items) {
        it.question = it.question.trim();
        it.recommendation = it.recommendation.trim();
        it.alternative = it.alternative.trim();
      }
      return { items, preamble: preamble.join("\n").trim() };
    }

    // --- diff (revise re-launch) ---
    // Read-only mirror of attachElementComments' target selection: collect the
    // normalized text of each commentable block in a section body, WITHOUT the
    // DOM mutation attachElementComments performs (table replaceWith, comment
    // buttons, mermaid/highlight). Used only for prev-vs-current block diffing.
    // Safe to read prev pre-highlight while current blocks are read post-highlight.js:
    // normText collapses all whitespace and highlight.js only wraps tokens in spans
    // (textContent unchanged), so identical source normalizes to the same string.
    function collectBlockTexts(bodyMarkdown) {
      const tmp = document.createElement("div");
      tmp.innerHTML = md(bodyMarkdown);
      const out = new Set();
      for (const c of Array.from(tmp.children)) {
        const tag = c.tagName;
        if (tag === "UL" || tag === "OL") {
          for (const li of Array.from(c.children)) if (li.tagName === "LI") out.add(normText(li.textContent));
        } else if (tag === "TABLE" || COMMENT_BLOCK_TAGS.includes(tag)) {
          out.add(normText(c.textContent));
        }
      }
      return out;
    }

    const decisionSig = (it) => normText(`${it.question} ${it.recommendation} ${it.alternative}`);
    const collectDecisionSigs = (body) => new Set(parseDecisions(body).items.map(decisionSig));

    // Compare current sections against the previous-launch plan; classify each
    // current section new/changed/unchanged and precompute per-section prev block
    // sets for the changed ones. Section identity is the slug id from parseSections.
    function buildDiff(prevMarkdown, sections) {
      const prev = parseSections(prevMarkdown);
      const prevById = new Map(prev.sections.map((s) => [s.id, s]));
      let matched = 0; // current sections that map to a prev section (ids are unique)
      for (const s of sections) {
        const p = prevById.get(s.id);
        if (!p) { diff.sectionStatus.set(s.id, "new"); diff.changedCount++; continue; }
        matched++;
        const changed = normText(s.body) !== normText(p.body);
        diff.sectionStatus.set(s.id, changed ? "changed" : "unchanged");
        if (changed) {
          diff.changedCount++;
          if (s.type === "decisions") diff.prevDecisionSigs.set(s.id, collectDecisionSigs(p.body));
          else diff.prevBlockTexts.set(s.id, collectBlockTexts(p.body));
        }
      }
      diff.removedCount = prev.sections.length - matched; // prev sections with no current counterpart
      diff.active = true;
    }

    // --- comment state ---
    function effectiveComments() {
      const ids = new Set([...state.comments.keys(), ...state.switches.keys()]);
      const out = [];
      for (const id of ids) {
        const switched = state.switches.has(id);
        const c = state.comments.get(id);
        const txt = c ? c.text.trim() : "";
        const excerpt = (c && c.excerpt) || state.switches.get(id) || "";
        // kind tells the caller which source the anchored block came from, so it never
        // has to infer that from the excerpt text; only a <figure> anchor is "figure".
        const kind = (c && c.kind) || "prose";
        let body = switched ? SWITCH_MSG + (txt ? "\n\n" + txt : "") : txt;
        if (body.trim()) out.push({ block: id, section: sectionOfBlockId(id), excerpt, kind, body });
      }
      return out;
    }

    function onCommentsChanged() {
      const n = effectiveComments().length;
      document.getElementById("comment-count").textContent = String(n);
      if (n > 0 && !state.decision) selectDecision("revise"); // commenting implies a revise
    }

    function setComment(id, text, btn, excerpt, kind) {
      const v = text.trim();
      if (v) state.comments.set(id, { text, excerpt, kind: kind || "prose" }); else state.comments.delete(id);
      if (btn) btn.classList.toggle("has-comment", Boolean(v));
      onCommentsChanged();
    }

    function setSwitch(id, on, excerpt) {
      if (on) state.switches.set(id, excerpt || ""); else state.switches.delete(id);
      onCommentsChanged();
    }

    function selectDecision(v) {
      state.decision = v;
      // Each decision radio carries a distinct name (so it is its own single-member
      // group — always a Tab stop, never collapsed out when the sibling is checked),
      // so enforce mutual exclusivity here rather than relying on native grouping.
      document.querySelectorAll(".decision-radio").forEach((r) => { r.checked = (r.value === v); });
      document.getElementById("send-btn").disabled = false;
    }

    // --- rendering ---
    function chip(label, value, cls) {
      return `<span class="chip ${cls || ""}"><b>${escapeHtml(label)}</b> ${escapeHtml(value)}</span>`;
    }

    function renderHeader(ov, planId, riskCount) {
      document.getElementById("plan-id").textContent = planId;
      document.getElementById("plan-title").innerHTML = ov.goal ? mdInline(ov.goal) : escapeHtml(planId);
      const chips = [];
      if (ov.difficulty) chips.push(chip("Difficulty", stripMd(ov.difficulty)));
      if (riskCount) chips.push(chip("Risks", String(riskCount), "risk"));
      document.getElementById("plan-chips").innerHTML = chips.join("");
      // Scope is descriptive (often a file list), so render it as a labeled meta row that wraps
      // rather than a fixed-shape pill alongside the short enum chips above.
      const scopeEl = document.getElementById("plan-scope");
      if (ov.scope) {
        scopeEl.innerHTML = `<span class="meta-label">Scope</span><span class="meta-val">${escapeHtml(stripMd(ov.scope))}</span>`;
        scopeEl.hidden = false;
      }
    }

    function renderDiffBanner() {
      if (!diff.active) return;
      const el = document.getElementById("diff-banner");
      el.textContent = diff.changedCount ? DIFF_BANNER(diff.changedCount, diff.removedCount) : DIFF_BANNER_NONE;
      el.hidden = false;
    }

    function renderNav(sections) {
      const toc = document.getElementById("toc");
      if (!sections.length) { toc.hidden = true; return; }
      for (const s of sections) {
        const a = document.createElement("a");
        a.href = `#sec-${s.id}`;
        a.textContent = s.title;
        a.addEventListener("click", () => {
          const det = document.getElementById(`sec-${s.id}`);
          if (det) det.open = true;
        });
        toc.appendChild(a);
      }
    }

    function renderPreamble(preamble, planEl) {
      const kept = preamble.split("\n").filter((l) => !/^##\s/.test(l)).join("\n").trim();
      if (!kept) return;
      const div = document.createElement("div");
      div.className = "preamble";
      div.innerHTML = md(kept);
      planEl.appendChild(div);
    }

    function makeCommentArea(placeholder) {
      const area = document.createElement("textarea");
      area.className = "comment-input";
      area.placeholder = placeholder;
      area.hidden = true;
      return area;
    }

    // Wire a comment button + textarea pair: typing updates the comment state, clicking
    // toggles the textarea. Shared by the decision-card and per-element comment affordances.
    function wireCommentToggle(btn, area, id, excerpt, kind) {
      area.addEventListener("input", () => setComment(id, area.value, btn, excerpt, kind));
      btn.addEventListener("click", (e) => { e.preventDefault(); area.hidden = !area.hidden; if (!area.hidden) area.focus(); });
    }

    function makeFreeComment(id, excerpt, placeholder) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "comment-btn";
      btn.textContent = placeholder;
      const area = makeCommentArea(placeholder + "…");
      wireCommentToggle(btn, area, id, excerpt);
      return { btn, area };
    }

    function renderDecisionCard(it, n) {
      const id = `decision-${n}`;
      const excerpt = excerptOf(it.question);
      const card = document.createElement("div");
      card.className = "decision-card";
      card.dataset.blockId = id;
      card.dataset.anchorKey = anchorNorm(it.question);

      const q = document.createElement("div");
      q.className = "dc-q";
      q.innerHTML = `<span class="dc-tag">Decision ${n}</span>${mdInline(it.question)}`;
      card.appendChild(q);

      const rec = document.createElement("div");
      rec.className = "dc-rec";
      rec.innerHTML = `<span class="dc-label">Recommendation</span>${md(it.recommendation)}`;
      card.appendChild(rec);

      if (it.alternative) {
        const alt = document.createElement("div");
        alt.className = "dc-alt";
        alt.innerHTML = `<span class="dc-label">Alternative</span>${md(it.alternative)}`;
        card.appendChild(alt);

        const toggle = document.createElement("div");
        toggle.className = "dc-toggle";
        toggle.innerHTML =
          `<label><input type="radio" name="sw-${n}" value="keep" checked> Keep recommendation</label>` +
          `<label><input type="radio" name="sw-${n}" value="switch"> Switch to alternative</label>`;
        toggle.querySelectorAll("input").forEach((r) =>
          r.addEventListener("change", () => {
            const on = toggle.querySelector("input[value=switch]").checked;
            card.classList.toggle("switched", on);
            setSwitch(id, on, excerpt);
          }),
        );
        card.appendChild(toggle);
      }

      const { btn, area } = makeFreeComment(id, excerpt, "Comment on this decision");
      card.appendChild(btn);
      card.appendChild(area);
      return card;
    }

    // Attach a hover comment affordance to each commentable block element in a rendered body.
    // List items are commentable individually (Build order steps / Risks / Test items); paragraphs,
    // code blocks, blockquotes, sub-headings, and tables are commentable as whole blocks.
    // AREA_INSIDE = tags whose textarea is appended *inside* the element (valid flow content);
    // others receive it as a sibling (afterend). DIV is the synthetic table wrapper from below.
    const AREA_INSIDE = new Set(["LI", "BLOCKQUOTE", "DIV", "FIGURE"]);
    // Put an affordance inside the block where the tag accepts flow content, beside it otherwise.
    const placeAffordance = (el, node) => {
      if (!AREA_INSIDE.has(el.tagName)) { el.insertAdjacentElement("afterend", node); return; }
      // A <figcaption> is only valid as the figure's first or last child, so go in front of it.
      const cap = el.tagName === "FIGURE" ? el.querySelector(":scope > figcaption") : null;
      if (cap) el.insertBefore(node, cap);
      else el.appendChild(node);
    };
    function attachComment(el, id) {
      el.classList.add("commentable");
      el.dataset.blockId = id;
      // Captured now, before collapseBuildOrderSteps strips the step separator and before the
      // affordances below join the element — both would otherwise shift the text a thread entry
      // is matched against.
      el.dataset.anchorKey = anchorNorm(el.textContent);
      const excerpt = excerptOf(el.textContent);
      const kind = el.tagName === "FIGURE" ? "figure" : "prose";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cbtn";
      btn.title = "Comment on this";
      btn.textContent = "💬";
      const area = makeCommentArea("Comment on this…");
      wireCommentToggle(btn, area, id, excerpt, kind);
      el.appendChild(btn);
      placeAffordance(el, area);
    }

    function attachElementComments(bodyEl, sectionId) {
      let n = 0;
      const targets = [];
      for (const c of Array.from(bodyEl.children)) {
        const tag = c.tagName;
        if (tag === "UL" || tag === "OL") {
          for (const li of Array.from(c.children)) if (li.tagName === "LI") targets.push(li);
        } else if (tag === "TABLE") {
          const w = document.createElement("div");
          c.replaceWith(w);
          w.appendChild(c);
          targets.push(w);
        } else if (COMMENT_BLOCK_TAGS.includes(tag)) {
          targets.push(c);
        }
      }
      // prevBlockTexts holds an entry only for a "changed" non-decisions section
      // (see buildDiff), so this lookup alone selects which sections mark blocks: a
      // "new" section relies on its section badge (every block is new), an
      // "unchanged" one has no entry. Read textContent before attachComment appends
      // the 💬 button (which would otherwise pollute it).
      const prevSet = diff.prevBlockTexts.get(sectionId) || null;
      for (const t of targets) {
        if (prevSet && !t.dataset.mermaidFigure && !prevSet.has(normText(t.textContent))) t.classList.add("block-changed");
        attachComment(t, `${sectionId}::${++n}`);
      }
    }

    // Collapse each Build order step to its bold heading, opening the detail on click — what lets
    // the section sit in the must-review tier without opening at full length. The step shape is
    // `N. **<heading>** — <detail>` (plan-authoring.md § Template); markdown puts that heading
    // directly under the <li> in a tight list and inside a wrapping <p> in a loose one (blank
    // lines between steps), and both are handled. A step that does not open with a bold heading,
    // or carries nothing behind one, is left alone — graceful degradation for plans predating the
    // shape.
    //
    // Must run *after* attachElementComments, for two reasons. The 💬 button and its textarea are
    // by then direct children of the <li>, so draining the <li> up to the first affordance leaves
    // them outside the nested <details> and a collapsed step stays commentable. And stripping the
    // separator below rewrites a text node inside the <li>, which attachElementComments reads for
    // the comment excerpt and for block-changed diff matching — run it first and every step reads
    // as changed on a revise re-launch.
    const STEP_SEP_RE = /^\s*[—–-]\s*/;
    function collapseBuildOrderSteps(bodyEl) {
      // First element child, but only when nothing except whitespace precedes it.
      const leadEl = (el) => {
        for (let n = el.firstChild; n; n = n.nextSibling) {
          if (n.nodeType === 3) { if (n.data.trim()) return null; continue; }
          return n.nodeType === 1 ? n : null;
        }
        return null;
      };
      const isAffordance = (n) =>
        n.nodeType === 1 && (n.classList.contains("cbtn") || n.classList.contains("comment-input"));

      // Safe to iterate the live collection: the loop only rearranges each <li>'s own children.
      for (const ol of bodyEl.querySelectorAll(":scope > ol")) {
        for (const li of ol.children) {
          if (li.tagName !== "LI") continue;
          const head = leadEl(li); // the <strong> in a tight list, the wrapping <p> in a loose one
          const strong = head && head.tagName === "P" ? leadEl(head) : head;
          if (!strong || strong.tagName !== "STRONG") continue;

          const owner = strong.parentNode; // only needed to put the heading back on the skip path
          const sep = strong.nextSibling; // the "— " between heading and detail, in either shape
          const sum = document.createElement("summary");
          sum.appendChild(strong); // detaching it leaves the <li> holding detail + affordances only
          let hasDetail = false;
          for (let n = li.firstChild; n && !isAffordance(n); n = n.nextSibling) {
            if (n.textContent.replace(STEP_SEP_RE, "").trim()) { hasDetail = true; break; }
          }
          if (!hasDetail) { owner.insertBefore(strong, owner.firstChild); continue; }

          const inner = document.createElement("div");
          inner.className = "step-body";
          while (li.firstChild && !isAffordance(li.firstChild)) inner.appendChild(li.firstChild);
          // Drop the separator; it reads as a stray dash once heading and detail are split apart.
          if (sep && sep.nodeType === 3) sep.data = sep.data.replace(STEP_SEP_RE, "");
          const det = document.createElement("details");
          det.className = "step";
          det.appendChild(sum);
          det.appendChild(inner);
          li.insertBefore(det, li.firstChild);
        }
      }
    }

    function renderSection(section) {
      const det = document.createElement("details");
      det.className = "section" + (section.type === "context" ? " is-context" : "");
      det.id = `sec-${section.id}`;
      // status is null outside diff mode, else "new" | "changed" | "unchanged"
      const status = diff.active ? (diff.sectionStatus.get(section.id) || "unchanged") : null;
      // diff mode overrides the default-open set: open changed/new, collapse unchanged
      if (status) det.open = (status === "new" || status === "changed");
      else if (OPEN_TYPES.has(section.type)) det.open = true;

      const sum = document.createElement("summary");
      sum.innerHTML = `<span class="sec-title">${escapeHtml(section.title)}</span>`;
      if (status === "new" || status === "changed") {
        sum.innerHTML += ` <span class="badge badge-diff">${status === "new" ? "New" : "Changed"}</span>`;
      }
      if (section.type === "risks" && section.itemCount) {
        sum.innerHTML += ` <span class="badge badge-risk">${section.itemCount}</span>`;
      }
      det.appendChild(sum);

      const body = document.createElement("div");
      body.className = "sec-body";
      let isCards = false;
      let preEl = null;

      if (section.type === "decisions") {
        const { items, preamble } = parseDecisions(section.body);
        if (items.length) {
          isCards = true;
          if (preamble) {
            const pre = document.createElement("div");
            pre.innerHTML = md(preamble);
            body.appendChild(pre);
            preEl = pre;
          }
          // changed Decisions section: highlight cards whose signature is absent from prev
          const prevSigs = status === "changed" ? diff.prevDecisionSigs.get(section.id) : null;
          items.forEach((it, i) => {
            const card = renderDecisionCard(it, i + 1);
            if (prevSigs && !prevSigs.has(decisionSig(it))) card.classList.add("card-changed");
            body.appendChild(card);
          });
        }
      }
      if (!isCards) {
        body.innerHTML = md(section.body); // shape-detection fallback: render as markdown
      }
      det.appendChild(body);
      return { det, bodyEl: body, isCards, preEl };
    }

    function highlightCode(root) {
      root.querySelectorAll("pre code").forEach((el) => {
        if (el.classList.contains("language-mermaid")) return; // rendered as a diagram instead
        window.hljs.highlightElement(el);
      });
    }

    async function renderMermaid(root) {
      const nodes = [];
      root.querySelectorAll("pre code.language-mermaid").forEach((code) => {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        const pre = code.closest("pre");
        // Wrap the diagram — and the caption paragraph right after the fence, when there is
        // one — in a <figure>, so a mermaid figure is the same commentable unit as an inline-SVG
        // one and its comment carries kind:"figure" instead of routing as prose.
        const fig = document.createElement("figure");
        // The prev-plan side of the diff holds this figure as its fence source (a PRE), while the
        // live side is this FIGURE carrying mermaid's injected CSS — they can never compare equal,
        // so the block-changed test skips a figure carrying this flag.
        fig.dataset.mermaidFigure = "1";
        pre.replaceWith(fig);
        fig.appendChild(div);
        const cap = fig.nextElementSibling;
        if (cap && cap.tagName === "P") {
          const fc = document.createElement("figcaption");
          while (cap.firstChild) fc.appendChild(cap.firstChild);
          cap.remove();
          fig.appendChild(fc);
        }
        nodes.push(div);
      });
      if (nodes.length) {
        try {
          // suppressErrors keeps a single bad fence from aborting the batch — valid sibling
          // fences still render; the failing one stays as its (un-rendered) source text.
          await mermaid.run({ nodes, suppressErrors: true });
        } catch (err) {
          console.error("mermaid render error", err);
        }
      }
    }

    // --- conversation thread (rounds already submitted) ---
    let THREAD = [];
    let DECISIONS_SECTION_ID = "";
    const threadBoxes = new Map();

    // An entry written before `anchor` existed, or one whose anchor lost its section, still
    // has its block id to fall back on.
    const entrySection = (e) => (e.anchor && e.anchor.section) || sectionOfBlockId(e.block);

    // Resolve an entry to the block it belongs under, or null to send it to the log alone.
    // A figure resolves by section — § Figures layer allows one per section, and a figure's own
    // text is an SVG's run-together labels or mermaid's injected CSS, neither of them an anchor.
    function findAnchorTarget(e) {
      const secId = entrySection(e);
      if (!secId) return null;
      const sec = document.getElementById(`sec-${secId}`);
      if (!sec) return null;
      if (e.kind === "figure") return sec.querySelector("figure");
      const want = anchorNorm(e.anchor && e.anchor.excerpt);
      const hits = [];
      for (const el of sec.querySelectorAll("[data-anchor-key]")) {
        if (anchorMatches(want, el.dataset.anchorKey)) hits.push(el);
      }
      // Exactly one, or none: drawing an ambiguous match under the wrong block reads as an
      // answer to a question that was never asked there, which the log panel does not.
      return hits.length === 1 ? hits[0] : null;
    }

    function threadItem(e, roundNo, opts) {
      const item = document.createElement("div");
      item.className = "th-item";
      const meta = document.createElement("div");
      meta.className = "th-meta";
      meta.textContent = `${TH.round(roundNo)} · ${TH.you}`;
      item.appendChild(meta);
      if (opts && opts.where) {
        const w = document.createElement("div");
        w.className = "log-where";
        w.textContent = TH.where(opts.where);
        item.appendChild(w);
      }
      const body = document.createElement("div");
      body.className = "th-body";
      body.textContent = e.body || "";
      item.appendChild(body);

      const reply = document.createElement("div");
      reply.className = "th-reply";
      const head = document.createElement("div");
      head.className = "th-meta";
      const label = Object.prototype.hasOwnProperty.call(TH.disposition, e.disposition) ? TH.disposition[e.disposition] : null;
      head.innerHTML =
        (e.reply ? (label ? `<span class="th-badge">${escapeHtml(label)}</span>` : "")
                 : `<span class="th-badge pending">${escapeHtml(TH.pending)}</span>`) + "Claude";
      reply.appendChild(head);
      if (e.reply) {
        const b = document.createElement("div");
        b.innerHTML = md(e.reply);
        reply.appendChild(b);
      }
      item.appendChild(reply);

      if (opts && opts.loose) {
        const w = document.createElement("div");
        w.className = "th-loose";
        w.textContent = TH.loose;
        item.appendChild(w);
      }
      return item;
    }

    function threadBox(target) {
      let box = threadBoxes.get(target);
      if (!box) {
        box = document.createElement("div");
        box.className = "thread";
        placeAffordance(target, box);
        threadBoxes.set(target, box);
      }
      return box;
    }

    // Replay each entry under its block where the anchor still resolves. Returns the ids that
    // did not resolve, which the log below marks — the log carries every entry either way, so
    // this pass duplicates rather than moves.
    function renderThread() {
      const loose = new Set();
      for (const round of THREAD) {
        for (const e of round.entries || []) {
          const target = findAnchorTarget(e);
          if (!target) { loose.add(e); continue; }
          threadBox(target).appendChild(threadItem(e, round.round));
        }
      }
      return loose;
    }

    // The complete record: every round, in order, whether or not it anchored in the body.
    function renderLog(planEl, loose) {
      const total = THREAD.reduce((n, r) => n + (r.entries || []).length, 0);
      if (!total) return;
      const det = document.createElement("details");
      det.id = "log";
      det.open = true;
      const sum = document.createElement("summary");
      sum.textContent = TH.log(total);
      det.appendChild(sum);
      for (const round of THREAD) {
        const rd = document.createElement("div");
        rd.className = "log-round";
        const h = document.createElement("h4");
        h.textContent = TH.round(round.round);
        rd.appendChild(h);
        for (const e of round.entries || []) {
          rd.appendChild(threadItem(e, round.round, {
            where: (e.anchor && e.anchor.excerpt) || e.block || "",
            loose: loose.has(e),
          }));
        }
        det.appendChild(rd);
      }
      planEl.appendChild(det);
    }

    async function init() {
      const res = await fetch("/api/plan", { cache: "no-store" });
      if (!res.ok) throw new Error(`/api/plan HTTP ${res.status}`);
      const { id, markdown, lang, prevMarkdown, thread, instance } = await res.json();
      THREAD = Array.isArray(thread) ? thread : [];
      INSTANCE = instance || null;
      if (lang === "ja") {
        SWITCH_MSG = "この Decision を Alternative に切り替える";
        DIFF_BANNER = (n, removed) => `🔍 前回レビューから ${n} 個のセクションが変更・追加されました${removed ? `（削除 ${removed} 件）` : ""} — 変更箇所を以下にハイライト`;
        DIFF_BANNER_NONE = "🔍 前回レビューからセクションの変更はありません";
        KBD_HINT = "<kbd>a</kbd> 承認 · <kbd>r</kbd> 変更を依頼 · <kbd>⌘/Ctrl+↵</kbd> 送信";
        APPLY_NOTE = "変更を依頼すると、コメントはその時点でプラン文書に反映されます。質問のコメントはプランを変えずにこのページ上で回答します。";
        TH = {
          you: "あなた",
          round: (n) => `ラウンド ${n}`,
          log: (n) => `会話ログ（${n} 件）`,
          pending: "返答待ち",
          loose: "本文中に位置を特定できませんでした",
          where: (t) => `対象: ${t}`,
          disposition: { answered: "回答のみ", revised: "プラン修正", both: "回答 + プラン修正" },
        };
        POLL_MSG = "Claude が対応中です。プランが更新されるとこのページは自動で読み直されます。";
        POLL_GIVEUP_MSG = "30 分間更新がありませんでした。ターミナルを確認してください（レビューがブラウザを離れて進んでいる可能性があります）。";
      }
      document.getElementById("kbd-hint").innerHTML = KBD_HINT;
      document.getElementById("apply-note").textContent = APPLY_NOTE;

      let { preamble, sections } = parseSections(markdown);
      if (!sections.length) sections = [{ title: "Plan", type: "other", id: "plan", body: markdown }];

      // diff mode: only on a revise re-launch where serve.mjs shipped a prev plan
      if (typeof prevMarkdown === "string" && prevMarkdown.trim()) buildDiff(prevMarkdown, sections);

      DECISIONS_SECTION_ID = (sections.find((s) => s.type === "decisions") || {}).id || "";
      const ovSection = sections.find((s) => s.type === "overview");
      const ov = parseOverview(ovSection ? ovSection.body : "");
      const risksSection = sections.find((s) => s.type === "risks");
      const riskCount = risksSection ? countListItems(risksSection.body) : 0;
      if (risksSection) risksSection.itemCount = riskCount; // reused by the section badge below
      renderHeader(ov, id, riskCount);
      renderDiffBanner();
      renderNav(sections);

      const planEl = document.getElementById("plan");
      renderPreamble(preamble, planEl);

      const bodyRefs = [];
      for (const s of sections) {
        const { det, bodyEl, isCards, preEl } = renderSection(s);
        planEl.appendChild(det);
        bodyRefs.push({ bodyEl, section: s, isCards, preEl });
      }

      // Run highlight + mermaid over the whole container first (mermaid replaces the
      // <pre> fence with a .mermaid div), then attach per-element comments so the comment
      // affordances land on stable rendered blocks (decision cards carry their own).
      highlightCode(planEl);
      await renderMermaid(planEl);
      // Both passes stay inside the one section body they are handed, so the collapse's
      // must-run-after-comments ordering is per-section and needs no document-wide barrier.
      for (const r of bodyRefs) {
        // A card section's cards carry their own comment affordances, but its preamble does not
        // — and that is where a figure targeting this section lands, so walk it.
        if (r.isCards) {
          if (r.preEl) attachElementComments(r.preEl, r.section.id);
          continue;
        }
        attachElementComments(r.bodyEl, r.section.id);
        if (STEP_COLLAPSE_TYPES.has(r.section.type)) collapseBuildOrderSteps(r.bodyEl);
      }

      // After the collapse, so a thread stays outside the <details> and remains visible on a
      // collapsed Build order step. Matching reads the anchor key captured before it, not live text.
      renderLog(planEl, renderThread());
    }

    document.querySelectorAll(".decision-radio").forEach((radio) => {
      radio.addEventListener("change", () => selectDecision(radio.value));
    });

    document.getElementById("send-btn").addEventListener("click", submit);

    // Focus-independent keyboard shortcuts. macOS Full Keyboard Access (off by
    // default) makes Chrome exclude the decision radios and Send button from Tab
    // order, so a/r/⌘|Ctrl+Enter are the reliable keyboard path regardless.
    document.addEventListener("keydown", (e) => {
      if (e.isComposing) return;                                            // mid-IME (e.g. Japanese) — don't hijack
      if (document.getElementById("app").classList.contains("submitted")) return; // gate already sent
      // Submit chord: Cmd/Ctrl+Enter, works anywhere including a comment field.
      // Bare Enter is intentionally NOT bound — it must keep toggling <details>
      // summaries and activating focused buttons/links natively.
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        if (state.decision) { e.preventDefault(); submit(); }
        return;
      }
      // Decision shortcuts: bare a/r, only outside text-entry fields and unmodified.
      const active = document.activeElement;
      const tag = active ? active.tagName : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (e.key === "a") { e.preventDefault(); selectDecision("approve"); }
      else if (e.key === "r") { e.preventDefault(); selectDecision("revise"); }
    });

    // Watch for the relaunched server. `instance` changes per process, so polling the old one
    // while it shuts down returns the value already held and reloads nothing; a connection
    // failure in between is the expected gap, not an error. /api/instance rather than /api/plan:
    // this runs every couple of seconds for as long as the caller takes.
    function startPolling() {
      if (!INSTANCE) return; // nothing to compare against — a reload would fire on the first poll
      const deadline = Date.now() + POLL_GIVEUP_MS;
      const timer = setInterval(async () => {
        if (Date.now() > deadline) {
          clearInterval(timer);
          document.getElementById("done").textContent = POLL_GIVEUP_MSG;
          return;
        }
        try {
          const r = await fetch("/api/instance", { cache: "no-store" });
          if (!r.ok) return;
          const j = await r.json();
          if (j.instance && j.instance !== INSTANCE) location.reload();
        } catch {
          /* server down between launches — keep waiting */
        }
      }, 2000);
    }

    let submitting = false; // re-entry guard: the button is disabled on click, but the keydown path is not
    async function submit() {
      if (submitting || !state.decision) return;
      submitting = true;
      const comments = effectiveComments();
      const sendBtn = document.getElementById("send-btn");
      const status = document.getElementById("status");
      sendBtn.disabled = true;
      status.textContent = "";
      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ decision: state.decision, comments }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        // `submitting` stays true on success (not reset) — the "submitted" class added
        // here is the keydown guard's first early-return, so re-entry can't slip through.
        document.getElementById("app").classList.add("submitted");
        const done = document.getElementById("done");
        // Only a revise brings the gate back: the caller applies the comments and relaunches on
        // the same port, so the tab waits here rather than closing the loop.
        if (state.decision === "revise") {
          done.textContent = POLL_MSG;
          startPolling();
        }
        done.hidden = false;
        document.getElementById("bar").style.display = "none";
        done.scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        submitting = false; // allow a retry after a failed POST
        sendBtn.disabled = false;
        status.textContent = `Failed to send: ${err.message}`;
      }
    }

    init().catch((err) => {
      document.getElementById("status").textContent = `Failed to load: ${err.message}`;
      console.error(err);
    });
  </script>
</body>
</html>
